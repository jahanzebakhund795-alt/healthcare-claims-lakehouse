[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claims"
version = "0.1.0"
description = "Healthcare claims lakehouse: synthetic FHIR/EDI claims, a DuckDB + dbt Data Vault warehouse with data-quality tests, a clinical knowledge graph, and vector code search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bushra Nazeer", email = "bushnaze@gmail.com" }]
keywords = ["data-engineering", "lakehouse", "dbt", "duckdb", "data-vault", "fhir", "knowledge-graph"]

dependencies = [
    "duckdb>=0.10",
    "dbt-core>=1.7",
    "dbt-duckdb>=1.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/bushra-nazeer/healthcare-claims-lakehouse"

[tool.hatch.build.targets.wheel]
packages = ["src/claims"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["dbt", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
